<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 — YLADevs</title>

  <meta
    name="description"
    content="This YLADevs page wasn't found or hasn't been created yet. YLADevs is still in development."
  >

  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08080d">

  <link rel="icon" href="/favicon.ico">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background: #08080d;
      color: #fff;

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      overflow: hidden;
    }

    /* Background */

    .background {
      position: fixed;
      inset: 0;
      z-index: -2;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(100, 75, 200, 0.16),
          transparent 38%
        ),
        #08080d;
    }

    .grid {
      position: absolute;
      inset: -100%;

      width: 300%;
      height: 300%;

      opacity: 0.13;

      background-image:
        linear-gradient(
          rgba(255,255,255,.06) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.06) 1px,
          transparent 1px
        );

      background-size: 55px 55px;

      transform: rotate(8deg);

      animation:
        gridMove 25s linear infinite;
    }

    .orb {
      position: absolute;

      width: 320px;
      height: 320px;

      border-radius: 50%;

      filter: blur(90px);

      opacity: .16;

      animation:
        float 9s ease-in-out infinite;
    }

    .orb.one {
      background: #704cff;
      top: -100px;
      left: -100px;
    }

    .orb.two {
      background: #00aaff;
      bottom: -120px;
      right: -100px;

      animation-delay: -4s;
    }

    /* Content */

    .container {
      width: min(650px, 90%);
      text-align: center;

      animation:
        pageIn .8s ease forwards;
    }

    .logo {
      width: 45px;
      height: 45px;

      margin: 0 auto 25px;

      display: grid;
      place-items: center;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #fff,
          #999
        );

      color: #08080d;

      font-weight: 900;
      font-size: 22px;

      animation:
        logoPulse 3s ease-in-out infinite;
    }

    .error {
      font-size: clamp(90px, 18vw, 160px);

      line-height: .9;

      font-weight: 900;

      letter-spacing: -9px;

      background:
        linear-gradient(
          90deg,
          #fff,
          #858590,
          #fff
        );

      background-size: 200% auto;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation:
        shine 5s linear infinite;
    }

    h1 {
      margin-top: 25px;

      font-size: clamp(24px, 5vw, 34px);

      letter-spacing: -1px;
    }

    p {
      margin: 16px auto 0;

      max-width: 520px;

      color: #9b9ba6;

      font-size: 16px;

      line-height: 1.7;
    }

    .development {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-top: 25px;

      padding: 9px 14px;

      border-radius: 999px;

      border: 1px solid rgba(255,255,255,.1);

      background:
        rgba(255,255,255,.035);

      color: #aaaab5;

      font-size: 13px;
    }

    .dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #63e6be;

      box-shadow:
        0 0 15px #63e6be;

      animation:
        pulse 2s infinite;
    }

    .home {
      display: inline-block;

      margin-top: 30px;

      padding: 12px 20px;

      border-radius: 10px;

      background: #fff;

      color: #08080d;

      text-decoration: none;

      font-size: 14px;

      font-weight: 700;

      transition:
        transform .25s ease,
        opacity .25s ease;
    }

    .home:hover {
      transform: translateY(-3px);
      opacity: .85;
    }

    footer {
      position: fixed;

      bottom: 25px;

      left: 0;
      right: 0;

      text-align: center;

      color: #555560;

      font-size: 12px;
    }

    /* Animations */

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes logoPulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.07);
      }
    }

    @keyframes shine {
      from {
        background-position: 0% center;
      }

      to {
        background-position: 200% center;
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: .35;
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-25px);
      }
    }

    @keyframes gridMove {
      from {
        transform: translate(0,0) rotate(8deg);
      }

      to {
        transform: translate(55px,55px) rotate(8deg);
      }
    }

    @media (max-width: 600px) {
      .error {
        letter-spacing: -5px;
      }

      p {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="grid"></div>
    <div class="orb one"></div>
    <div class="orb two"></div>
  </div>

  <main class="container">

    <div class="logo">Y</div>

    <div class="error">404</div>

    <h1>Hey, this page wasn't found.</h1>

    <p>
      This page either hasn't been made yet or doesn't exist.
      We're still working on YLADevs and getting everything ready
      for students and developers.
    </p>

    <div class="development">
      <span class="dot"></span>
      YLADevs is still in development
    </div>

    <br>

    <a class="home" href="/">
      ← Back to YLADevs
    </a>

  </main>

  <footer>
    © <span id="year"></span> YLADevs
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
